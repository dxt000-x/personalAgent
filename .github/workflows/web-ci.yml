name: Web CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  web:
    name: Test, lint, build, and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run automated tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build production app
        run: npm run build
      - name: Typecheck generated Next.js types
        run: npm run typecheck
